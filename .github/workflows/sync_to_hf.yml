name: Deploy to Hugging Face Space

on:
  # Triggers the workflow on push events to the main branch
  push:
    branches:
      - main
    # Optional: Only trigger if files in the OlegV1 folder actually change
    paths:
      - 'hf_deploy/**' 
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # IMPORTANT: Subtree commands require the full git history. 
          # Without this, the split will fail.
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Extract the OlegV1 folder into a temporary local branch called 'hf-deploy'
          git subtree split --prefix hf_deploy -b hf-deploy
          
          # 2. Force push that branch to the remote main branch on Hugging Face
          git push https://OlegBergs:${HF_TOKEN}@huggingface.co/spaces/OlegBergs/route_backend_api hf-deploy:main --force
