name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - 'hf_deploy/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true                  # ← Pull LFS files from GitHub too

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git lfs install            # ← Enable LFS globally

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git subtree split --prefix hf_deploy -b hf-deploy
          git push https://OlegBergs:${HF_TOKEN}@huggingface.co/spaces/OlegBergs/route_backend_api hf-deploy:main --force
