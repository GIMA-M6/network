name: Sync to Hugging Face
on:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git subtree push --prefix OlegV1 --force https://OlegBergs:$HF_TOKEN@huggingface.co/spaces/OlegBergs/route_backend_api main
