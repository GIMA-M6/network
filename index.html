<!DOCTYPE html>
<html>
<head>
    <title>Mijn Routekaart</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet.Pathfinding CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-pathfinding@0.6.0/leaflet-pathfinding.min.css" />
    <!-- Eigen CSS -->
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="route-controls">
        <h1>Mijn Routekaart</h1>
        <label for="start">Startpunt:</label>
        <input type="text" id="start" placeholder="Voer een locatie in" />

        <label for="end">Eindpunt:</label>
        <input type="text" id="end" placeholder="Voer een locatie in" />

        <button id="plan-route">Route plannen</button>
    </div>
    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet.Pathfinding JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet-pathfinding@0.6.0/leaflet-pathfinding.min.js"></script>

    <script>
        // Initialiseer de kaart
        const map = L.map('map').setView([52.09, 5.1], 12);

        // Voeg OpenStreetMap basislaag toe
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Variabelen voor de graaf en route
        let graph = null;
        let pathfindingLayer = null;

        // Laad de GeoJSON en bouw de graaf
        fetch('edges.geojson')
            .then(response => response.json())
            .then(data => {
                // Teken de GeoJSON op de kaart
                const geojsonLayer = L.geoJSON(data, {
                    style: {
                        color: '#e74c3c',
                        weight: 2,
                        opacity: 0.8
                    }
                }).addTo(map);
                map.fitBounds(geojsonLayer.getBounds());

                // Bouw de graaf
                graph = new Pathfinding.Graph();

                data.features.forEach(feature => {
                    if (feature.geometry.type === 'LineString') {
                        const coords = feature.geometry.coordinates;
                        const start = L.latLng(coords[0][1], coords[0][0]);
                        const end = L.latLng(coords[coords.length - 1][1], coords[coords.length - 1][0]);

                        graph.addVertex(start);
                        graph.addVertex(end);
                        graph.addEdge(start, end, 1);
                    }
                });
            })
            .catch(err => console.error('Fout bij laden GeoJSON:', err));

        // Functie om een route te berekenen en te tekenen
        function findAndDrawPath(startLatLng, endLatLng) {
            if (!graph) {
                alert('De graaf is nog niet geladen!');
                return;
            }

            if (pathfindingLayer) {
                map.removeLayer(pathfindingLayer);
            }

            const startNode = graph.getClosestNode(startLatLng);
            const endNode = graph.getClosestNode(endLatLng);

            const path = graph.findPath(startNode, endNode);

            if (path.length === 0) {
                alert('Geen route gevonden tussen de opgegeven punten!');
                return;
            }

            const pathCoords = path.map(node => [node.lat, node.lng]);
            pathfindingLayer = L.polyline(pathCoords, {
                color: 'blue',
                weight: 5,
                opacity: 0.8
            }).addTo(map);

            map.fitBounds(pathfindingLayer.getBounds());
        }

        // Functie om een adres om te zetten naar coördinaten
        async function geocodeAddress(address) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`;
            const response = await fetch(url, {
                headers: {
                    'User-Agent': 'MijnRoutekaart/1.0'
                }
            });
            const data = await response.json();

            if (data.length === 0) {
                return null;
            }

            return {
                lat: parseFloat(data[0].lat),
                lon: parseFloat(data[0].lon)
            };
        }

        // Voeg event listener toe aan de knop
        document.getElementById('plan-route').addEventListener('click', async function() {
            const startInput = document.getElementById('start').value;
            const endInput = document.getElementById('end').value;

            if (!startInput || !endInput) {
                alert('Voer zowel een start- als eindpunt in!');
                return;
            }

            try {
                const startCoords = await geocodeAddress(startInput);
                const endCoords = await geocodeAddress(endInput);

                if (!startCoords || !endCoords) {
                    alert('Kon een of beide locaties niet vinden!');
                    return;
                }

                const startLatLng = L.latLng(startCoords.lat, startCoords.lon);
                const endLatLng = L.latLng(endCoords.lat, endCoords.lon);

                findAndDrawPath(startLatLng, endLatLng);
            } catch (error) {
                console.error('Fout bij geocoden:', error);
                alert('Er is een fout opgetreden bij het omzetten van adressen.');
            }
        });
    </script>
</body>
</html>
